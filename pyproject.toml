[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperchecker"
version = "0.1.0"
description = "LLM-powered citation verifier for academic papers — extracts, checks, and validates LaTeX citations against source documents"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gavin Mendel-Gleason", email = "gavin@scidonia.ai" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "spacy>=3.8.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "httpx>=0.28.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "playwright>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "black>=24.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/scidonia/paperchecker"
Repository = "https://github.com/scidonia/paperchecker"

[project.scripts]
paperchecker = "paperchecker.main:app"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
